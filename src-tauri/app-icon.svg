<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The source of icons/ (pnpm tauri icon src-tauri/app-icon.svg): the app's Slidr mark, a
       slide stepping forward from the one behind it with a spark breaking out of its corner, on a
       tile of warmer light, and a picture on the slide: the studio makes the library's designs. -->
  <defs>
    <linearGradient id="tile" x1="64" y1="64" x2="960" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.5" stop-color="#e5487a"/>
      <stop offset="1" stop-color="#7b3fe4"/>
    </linearGradient>
    <path id="spark" d="M25.5 5.5Q26.38 10.12 31 11Q26.38 11.88 25.5 16.5Q24.62 11.88 20 11Q24.62 10.12 25.5 5.5Z"/>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#spark" fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g transform="translate(160 160) scale(22)">
    <g mask="url(#cut)">
      <rect x="3" y="6" width="18" height="13" rx="2.5" fill="#fff" fill-opacity="0.5"/>
      <rect x="7" y="12" width="20" height="14" rx="3" fill="#fff"/>
      <circle cx="12.4" cy="16.2" r="1.7" fill="#ff8a3d"/>
      <path d="M9.6 23.6 L14.4 18.4 L17.4 21.4 L20.2 18.9 L24.4 23.6 Z" fill="#7b3fe4"/>
      <path d="M15.6 23.6 L20.2 18.9 L24.4 23.6 Z" fill="#e5487a"/>
    </g>
    <use href="#spark" fill="#ffd166"/>
  </g>
</svg>
